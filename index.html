<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5E4E">
<title>당신의 봉화</title>
<link rel="manifest" href="public.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="ui.css">
<style>
:root{--acc:#2E5E4E;--acc-soft:#eef2f0}
footer{max-width:1100px;margin:0 auto;padding:18px 16px 46px;color:var(--sub);font-size:12.5px;line-height:1.7;border-top:1px solid var(--line)}
/* 한눈에 — 언제·어디서·누구만 */
.glist{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:15px;line-height:1.5}
.glist dt{color:var(--sub);font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:5px;padding-top:2px}
.glist dt .gi{font-size:15px}
.glist dd{margin:0;font-weight:600}
</style>
</head>
<body>
<footer>
 <b>🔔 알림 받기</b> — 관심 있는 일에 ☆를 누른 뒤 위 [🔔 알림받기]를 누르면
 휴대폰 캘린더에 담깁니다. 그러면 날짜 전에 휴대폰이 알아서 알려 줍니다.<br><br>
 이 정보는 봉화군 홈페이지에 공개된 주간업무 계획을 바탕으로 합니다.
 계획 단계의 내용이므로 실제 일정과 장소가 달라질 수 있습니다.
 참여하시기 전에 담당 부서로 한 번 확인해 주세요.
</footer>
<script src="core.js"></script>
<script src="ui.js"></script>
<script>
(function(){const s=document.createElement('script');s.src='data.js?v='+Date.now();s.onload=init;document.head.appendChild(s)})();

function init(){
 const D=window.BW_DATA, E=BW.escH;
 const FKEY='bh.fav';
 let fav={};try{fav=JSON.parse(localStorage.getItem(FKEY))||{}}catch(e){}
 const saveFav=()=>localStorage.setItem(FKEY,JSON.stringify(fav));
 const phoneOf=d=>D.deptPhones[d]||'';

 /* 분류는 현안마다 한 번만 계산해 둔다 (3천 건을 매번 훑으면 느리다) */
 const tag=iss=>{
  if(iss._cls)return iss._cls;
  const last=iss.list[iss.list.length-1];
  iss._cls={
   topics:BW.topicsOf(last.item),
   auds:BW.audiencesOf(last.item),
   regions:BW.regionsOf(last.item),
   score:BW.citizenScore(last.item),
   week:last.week, item:last.item
  };
  return iss._cls;
 };

 /* ── 관심 업무 → 휴대폰 캘린더 알림 ──
    서버가 없어 앱이 직접 알림을 못 보내므로, 일정을 알림과 함께 캘린더에 넣어
    휴대폰 캘린더가 대신 알려주게 한다(.ics 파일). 개인정보·계정 없이 동작. */
 const pad=n=>String(n).padStart(2,'0');
 /* 안건별 고정 UID — 제목이 전부 한글이어도 겹치지 않게 해시로 만든다.
    같은 안건은 늘 같은 UID라, 다시 담아도 캘린더에 중복 생성되지 않는다. */
 const uidHash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
 const icsD=ymd=>ymd.replace(/-/g,'');
 const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/[;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const icsStamp=()=>{const d=new Date();return ''+d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'};
 function timeOf(item){
  for(const l of item.lines){const m=l.txt.match(/(\d{1,2})\s*:\s*(\d{2})/);if(/일\s*시/.test(l.txt)&&m)return{h:+m[1],mi:+m[2]}}
  return null;
 }
 function icsEvent(iss){
  const c=tag(iss), r=BW.parseDateRange(c.item,c.week);
  if(!r||!r.start)return null;
  const today=BW.ymd(new Date()), end=r.end||r.start;
  if(end<today)return null;                          /* 이미 지난 일정은 알림 무의미 */
  const placeLine=c.item.lines.find(l=>/^(장\s*소|위\s*치)/.test(l.txt));
  const loc=placeLine?placeLine.txt.replace(/^[^:：]*[:：]\s*/,'').trim():c.regions.filter(x=>x!=='공통').join(', ');
  const t=timeOf(c.item);
  const L=['BEGIN:VEVENT','UID:bh'+uidHash(iss._id)+'@bonghwa','DTSTAMP:'+icsStamp()];
  let alarms;
  if(t){
   L.push('DTSTART:'+icsD(r.start)+'T'+pad(t.h)+pad(t.mi)+'00');
   const ed=new Date(BW.d2(r.start).getFullYear(),BW.d2(r.start).getMonth(),BW.d2(r.start).getDate(),t.h+1,t.mi);
   L.push('DTEND:'+icsD(BW.ymd(ed))+'T'+pad(ed.getHours())+pad(ed.getMinutes())+'00');
   alarms=['-P1D','-PT2H'];                          /* 하루 전 · 2시간 전 */
  }else{
   L.push('DTSTART;VALUE=DATE:'+icsD(r.start),'DTEND;VALUE=DATE:'+icsD(BW.ymd(BW.addD(BW.d2(end),1))));
   alarms=['-PT15H'];                                /* 종일 → 전날 오전 9시쯤 */
  }
  L.push('SUMMARY:'+icsEsc('[봉화군] '+iss.title));
  if(loc)L.push('LOCATION:'+icsEsc(loc));
  L.push('DESCRIPTION:'+icsEsc(iss.dept+' · 봉화군 주간업무 안내\n계획 단계 정보라 실제 일정과 다를 수 있습니다.'));
  alarms.forEach(tr=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(iss.title),'TRIGGER:'+tr,'END:VALARM'));
  L.push('END:VEVENT');
  return L.join('\r\n');
 }
 function buildICS(list){
  const evs=list.map(icsEvent).filter(Boolean);
  if(!evs.length)return null;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bonghwa//weekly//KO','CALSCALE:GREGORIAN',...evs,'END:VCALENDAR'].join('\r\n');
 }
 function downloadICS(text,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 }
 /* 파일을 '어디 저장됐는지 모르게' 내려받는 대신, 팝업을 띄우고
    한 번 눌러 바로 캘린더에 추가되게 한다. 카카오톡 인앱 브라우저는
    다운로드가 잘 안 보이므로 '기본 브라우저로 열기'를 함께 안내한다. */
 const UA=navigator.userAgent;
 const inApp=/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(UA);
 const isKakao=/KAKAOTALK/i.test(UA);

 function calModal(list,base){
  const events=list.map(icsEvent).filter(Boolean);
  if(!events.length){BWUI.toast('알림 받을 일정이 없어요 — 날짜가 지났거나 정해지지 않았습니다');return}
  const ics=buildICS(list), fname=base+'.ics';
  let m=document.getElementById('calModal');
  if(!m){m=document.createElement('div');m.id='calModal';m.className='modal';document.body.appendChild(m)}
  m.innerHTML=`<div class="mbox">
    <h2>휴대폰 캘린더에 추가</h2>
    <div class="note">관심 일정 <b>${events.length}개</b>를 캘린더에 담아요.
      추가하면 <b>날짜 전에 휴대폰이 알림</b>을 줍니다. (기존 일정은 그대로예요)</div>
    <div style="padding:8px 18px 2px"><button class="callbtn" id="calAdd" style="width:100%">📅 캘린더에 추가하기</button></div>
    ${inApp?`<div class="note" style="color:#8a4b3b;padding-top:8px">
       ${isKakao?'카카오톡 화면에서는 캘린더 추가가 막힐 수 있어요. 아래 <b>[기본 브라우저로 열기]</b>를 누른 뒤 다시 시도해 주세요.'
                :'앱 안에서는 막힐 수 있어요. 오른쪽 위 메뉴 → <b>‘다른 브라우저로 열기’</b> 후 다시 시도해 주세요.'}</div>
       ${isKakao?`<div style="padding:4px 18px 0"><button class="callbtn" id="calExt" style="width:100%;background:var(--paper);color:var(--acc);border:1.5px solid var(--acc)">🌐 기본 브라우저로 열기</button></div>`:''}`:''}
    <div class="mfoot"><span style="flex:1"></span><button id="calCancel">닫기</button></div>
  </div>`;
  m.classList.add('open');
  const close=()=>m.classList.remove('open');
  m.querySelector('#calCancel').onclick=close;
  m.onclick=e=>{if(e.target===m)close()};
  const ext=m.querySelector('#calExt');
  if(ext)ext.onclick=()=>{location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)};
  m.querySelector('#calAdd').onclick=async()=>{
   const file=new File([ics],fname,{type:'text/calendar'});
   /* 1) 공유 시트 — 가장 매끄럽다. 눌러서 '캘린더'를 고르면 바로 추가된다. */
   if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'봉화군 관심 일정'});close();return}
    catch(err){if(err&&err.name==='AbortError')return}   /* 사용자가 취소 */
   }
   /* 2) 공유가 안 되면 파일 열기 — 열리면 캘린더 추가 화면이 뜬다. */
   downloadICS(ics,fname); close();
   BWUI.toast('파일이 열리면 [추가]를 누르면 캘린더에 들어갑니다');
  };
 }
 function remindFav(){
  const favIss=BWUI.api.issues.filter(i=>fav[i._id]);
  if(!favIss.length){BWUI.toast('관심 업무를 먼저 담아 주세요 (☆)');return}
  calModal(favIss,'봉화군_관심일정');
 }

 BWUI.start({
  role:'public', title:'당신의 봉화',
  searchPlaceholder:'궁금한 일을 검색해 보세요 (예: 축제, 도로, 교육)',
  listTitle:'봉화군에서는?',   /* 앞에 '이번 주' / '7월 28일(화)' 처럼 기간이 붙는다 */
  publicLabels:true,
  progAsStage:true,
  showAppearance:false,      /* 등장 기준 추정치는 내보내지 않음 (§8.2) */
  showSimilar:false,
  showHistory:false,
  hideTiles:true,            /* '언제'는 달력이 맡는다 */
  hideDeptTag:true,          /* 군민은 어느 과인지로 고르지 않는다 — 문의할 때만 필요 */
  /* 카드 태그도 위 '주제' 축과 같은 분류를 쓴다 */
  typeTag:iss=>({v:tag(iss).topics[0], label:tag(iss).topics[0], axis:'topic'}),

  /* 군민이 참여할 수 있는 일부터 위로 */
  sortWith:(a,b)=>tag(b).score-tag(a).score,

  headerButtons:[
   {label:'⭐ 관심',on(){BWUI.api.setCustom('fav')}},
   {label:'🔔 알림받기',on:remindFav}
  ],
  customFilters:{fav:{label:'관심 업무만',fn:iss=>!!fav[iss._id]}},

  /* ── 세 갈래로 좁혀 가기 (언제는 위 달력이 맡는다) ──
     각 축은 '전체'가 기본이다. 아무것도 안 고르면 전부 보인다. */
  axes:[
   {key:'topic', label:'무엇을 찾으세요?', chipLabel:'주제', render:'cards',
    allLabel:'전체', allIcon:'🗂️',
    values:BW.TOPICS.map(t=>({v:t.k,label:t.k,icon:t.icon}))
             .concat([{v:'그 밖의 일',label:'그 밖의 일',icon:'📄'}]),
    match:(iss,v)=>tag(iss).topics.includes(v)},

   {key:'aud', label:'누구를 위한 일인가요?', chipLabel:'대상', render:'circles',
    allLabel:'전체', allIcon:'👪',
    values:BW.AUDIENCES.map(a=>({v:a.k,label:a.k,icon:a.icon})),
    match:(iss,v)=>tag(iss).auds.includes(v)},

   {key:'region', label:'어디에서 열리나요?', chipLabel:'지역', render:'chips',
    allLabel:'전체',
    values:[{v:'공통',label:'공통',chip:'공통(전 지역)'}].concat(BW.REGIONS.map(r=>({v:r,label:r}))),
    match:(iss,v)=>tag(iss).regions.includes(v)}
  ],

  cardActions:iss=>[{
   icon:fav[iss._id]?'★':'☆', title:'관심 업무', active:!!fav[iss._id],
   on(i){ if(fav[i._id])delete fav[i._id]; else fav[i._id]={at:BW.ymd(new Date())}; saveFav(); }
  }],

  /* 카드 한 줄에 언제·어디서·누구 */
  cardMeta:iss=>{
   const c=tag(iss), bits=[];
   const r=BW.parseDateRange(c.item,c.week);
   if(r&&r.start){
    const s=BW.d2(r.start);
    bits.push(r.end&&r.end!==r.start
     ? `${s.getMonth()+1}.${s.getDate()} ~ ${BW.d2(r.end).getMonth()+1}.${BW.d2(r.end).getDate()}`
     : `${s.getMonth()+1}월 ${s.getDate()}일(${BW.DOW[s.getDay()]})`);
   }
   if(c.regions.length)bits.push(c.regions.slice(0,2).join('·'));
   if(c.auds.length)bits.push(c.auds.slice(0,2).join('·'));
   return bits.join(' · ');
  },

  /* 제목 옆 ⭐ — 본문에 같은 체크박스를 또 두지 않는다 */
  sheetActions:iss=>[{
   icon:fav[iss._id]?'★':'☆', title:'관심 업무', active:!!fav[iss._id],
   on(i){ if(fav[i._id])delete fav[i._id]; else fav[i._id]={at:BW.ymd(new Date())};
          saveFav(); BWUI.toast(fav[i._id]?'관심 업무에 담았습니다':'관심 업무에서 뺐습니다'); BWUI.api.render(); }
  }],

  /* ── 상세 맨 위: 판단에 필요한 것만 ── */
  detailTop(iss,body){
   const c=tag(iss);
   const strip=t=>t.replace(/^[^:：]*[:：]\s*/,'').trim();
   const line=re=>{const l=c.item.lines.find(x=>re.test(x.txt));return l?strip(l.txt):''};
   const when=line(/^(일\s*시|기\s*간|일\s*자|기\s*한|점검기간|접수기간|모집기간|교육기간|운영기간|신청기한)/);
   const place=line(/^(장\s*소|위\s*치|신청장소|접수처)/) || c.regions.join(', ');
   const who=line(/^(대\s*상|참석대상|교육대상|모집대상|지원대상)/) || c.auds.join(', ');
   const rows=[
    when  && ['📅','언제', when],
    place && ['📍','어디서', place],
    who   && ['👥','누구',  who]
   ].filter(Boolean);
   body.insertAdjacentHTML('beforeend',`
    <div class="blk glance">
     <div class="tagrow" style="margin-bottom:10px">
      <span class="tag st st-${iss._st}" style="cursor:default">${BWUI.api.ST_LABEL[iss._st]}</span>
      <span class="tag type" style="cursor:default">${E(c.topics[0])}</span>
     </div>
     ${rows.length?`<dl class="glist">${rows.map(([ic,k,v])=>
       `<dt><span class="gi">${ic}</span>${k}</dt><dd>${E(v)}</dd>`).join('')}</dl>`
      :'<div class="hint">일정과 장소가 계획서에 적혀 있지 않습니다.</div>'}
    </div>`);
  },

  /* 본문은 '무엇을 하는가'만 남긴다.
     위에 이미 쓴 줄(일시·장소·대상)과 행정 내부 항목(참여단체·협조사항·근거·사업비)은 뺀다.
     뺀 것은 아래 [계획서 원문 그대로 보기]에 그대로 남아 있다. */
  contentTitle:'무엇을 하나요',
  contentLines(iss,lines){
   const already=/^(일\s*시|기\s*간|일\s*자|기\s*한|마\s*감|점검기간|접수기간|모집기간|교육기간|운영기간|신청기한|장\s*소|위\s*치|신청장소|접수처|대\s*상|참석대상|교육대상|모집대상|지원대상)/;
   const inner=/^(참여단체|참석인원|참석자|참\s*석|협조사항|추진근거|근\s*거|사업비|사\s*업\s*비|총사업비|예\s*산|담\s*당|주\s*관|점검자|조사자|점검반|추진방법|비\s*고|기타사항|제출처|보조비율)/;
   const out=lines.filter(l=>!already.test(l.txt)&&!inner.test(l.txt))
    /* '주요내용:' 라벨은 위 제목이 이미 말하고 있으니 지운다.
       콜론 없이 '주요내용' 한 줄만 있고 아래 줄에 내용이 오는 문서도 있어 그 줄도 없앤다. */
    .map(l=>({lv:l.lv,txt:l.txt.replace(/^(주요\s*내용|내\s*용|사업내용|프로그램|추진내용|교육내용|점검내용|주요\s*사업)\s*[:：]?\s*/,'')}))
    .filter(l=>l.txt.trim());
   return out;
  },

  detailFooter(iss){
   const tel=phoneOf(iss.dept)||'054-679-6114';
   const canRemind=!!buildICS([iss]);
   return `<div style="display:flex;gap:8px">
     ${canRemind?`<button class="callbtn" id="remindBtn" style="flex:1;background:var(--paper);color:var(--acc);border:1.5px solid var(--acc)">🔔 알림 받기</button>`:''}
     <a class="callbtn" href="tel:${tel}" style="flex:1">📞 문의</a>
   </div>`;
  },
  onFooterMount(iss,foot){
   const b=foot.querySelector('#remindBtn'); if(!b)return;
   b.onclick=()=>{
    if(!fav[iss._id]){fav[iss._id]={at:BW.ymd(new Date())};saveFav();BWUI.api.render()}  /* 알림 걸면 관심에도 담김 */
    calModal([iss],'봉화군_'+iss.title.replace(/[^가-힣0-9a-zA-Z]/g,'').slice(0,14));
   };
  }
 });
}
</script>
</body>
</html>
