<style>
footer{max-width:1100px;margin:0 auto;padding:18px 16px 46px;color:var(--sub);font-size:12.5px;line-height:1.7;border-top:1px solid var(--line)}
footer a{color:var(--acc);font-weight:700;text-decoration:underline;text-decoration-color:rgba(31,75,63,.4);text-underline-offset:3px}
/* 한눈에 — 언제·어디서·누구만 */
.glist{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin:0;font-size:15px;line-height:1.5}
.glist dt{color:var(--sub);font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:5px;padding-top:2px}
.glist dt .gi{font-size:15px}
.glist dd{margin:0;font-weight:600}

/* ── 헤더 부제 ── */
.bw-sub{width:100%;font-size:13px;font-weight:600;opacity:.9;margin-top:3px}

/* ── 상단 주간 달력 (데이 스트립) + 기간 버튼 ── */
.wstrip{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;margin-bottom:12px}
.ws-today{font-size:13.5px;font-weight:700;color:var(--acc);padding:0 2px 2px}
.ws-scopes{display:flex;gap:6px;margin:10px 0 9px}
.ws-scopes button{flex:1;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
 color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;transition:all var(--bh-dur,180ms) var(--bh-ease,ease)}
.ws-scopes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.wstrip .cal{border:none;background:transparent;padding:0;gap:4px}
.wstrip .calday{position:relative;min-height:62px}
.ws-dot{position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.calday.on .ws-dot{background:#fff}

/* ── 접이식 검색 (네이버페이식) — 접힌 바를 누르면 아래로 펼쳐져 키워드 입력 ── */
.searchbar{display:none}   /* 기본 검색창은 숨기고 아래 카드로 대체 */
.psearch{border:1px solid var(--line);border-radius:14px;background:var(--paper);
 margin-bottom:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.psearch.open{border-color:var(--acc);box-shadow:0 0 0 3px var(--bh-primary-tint,var(--acc-soft))}
.ps-bar{width:100%;display:flex;align-items:center;gap:10px;min-height:54px;padding:13px 15px;
 background:transparent;border:none;cursor:pointer;text-align:left;font:inherit}
.ps-mag{width:21px;height:21px;color:var(--sub);flex:none}
.psearch.open .ps-mag{color:var(--acc)}
.ps-text{flex:1;min-width:0;color:var(--sub);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-text.has{color:var(--ink);font-weight:600}
.ps-pill{flex:none;font-size:12.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:999px;padding:5px 11px}
.ps-panel{max-height:0;overflow:hidden;padding:0 15px;transition:max-height .32s var(--bh-ease,ease),padding .32s var(--bh-ease,ease)}
.psearch.open .ps-panel{max-height:460px;padding:2px 15px 15px}
.ps-input{width:100%;min-height:50px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;
 background:var(--bg);color:var(--ink);font-size:16px}
.ps-input:focus{outline:none;border-color:var(--acc);background:var(--paper);box-shadow:0 0 0 3px var(--bh-primary-tint,var(--acc-soft))}
.ps-lab{margin:16px 2px 8px;font-size:13px;font-weight:700;color:var(--sub)}
.ps-scopes{display:flex;gap:8px}
.ps-scopes button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:11px;background:var(--paper);
 color:var(--ink);font-size:14.5px;font-weight:600;cursor:pointer;transition:all var(--bh-dur,180ms) var(--bh-ease,ease)}
.ps-scopes button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ps-actions{display:flex;gap:8px;margin-top:15px}
.ps-reset{flex:none;min-width:90px;min-height:52px;border:1px solid var(--line);border-radius:12px;
 background:var(--paper);color:var(--sub);font-size:15px;font-weight:600;cursor:pointer}
.ps-go{flex:1;min-height:52px;border:none;border-radius:12px;background:var(--acc);color:#fff;
 font-size:16px;font-weight:800;cursor:pointer;box-shadow:var(--bh-shadow-cta,0 8px 22px rgba(31,75,63,.28))}

/* ── 첫 화면 인트로 (마스코트 인사 → 헤더로 올라감) ── */
#intro{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
#intro .ibg{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 0%, var(--bh-primary-tint,#eaf3ee) 0%, var(--bg,#f6f7f8) 60%);
  transition:opacity .5s ease}
#intro.go .ibg{opacity:0}
#intro .intro-mascot{position:relative;width:min(46vw,180px);height:min(46vw,180px);
 will-change:transform;animation:introPop .6s cubic-bezier(.2,.9,.3,1.3) both, floaty 3s ease-in-out .6s infinite}
#intro .intro-mascot svg{width:100%;height:100%;display:block;
 filter:drop-shadow(0 14px 26px rgba(31,75,63,.20))}
#intro .intro-text{position:relative;margin-top:26px;font-size:clamp(19px,5.4vw,26px);
 font-weight:800;line-height:1.55;color:var(--ink);letter-spacing:-.02em;
 animation:introUp .6s ease .15s both;transition:opacity .3s ease}
#intro .intro-text b{color:var(--acc)}
#intro .intro-sub{position:relative;margin-top:10px;font-size:14px;color:var(--sub);
 animation:introUp .6s ease .25s both;transition:opacity .3s ease}
#intro .intro-btn{position:relative;margin-top:34px;padding:16px 46px;border:none;
 border-radius:var(--bh-r-xl,20px);background:var(--acc);color:#fff;font-size:17px;font-weight:800;
 box-shadow:var(--bh-shadow-cta,0 8px 22px rgba(31,75,63,.28));cursor:pointer;
 animation:introUp .6s ease .35s both;transition:opacity .3s ease,transform var(--bh-dur-fast,120ms) var(--bh-ease,ease)}
#intro .intro-btn:active{transform:scale(.96)}
#intro.go .intro-text,#intro.go .intro-sub,#intro.go .intro-btn{opacity:0;pointer-events:none}
@keyframes introPop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes introUp{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
/* 헤더에 자리잡는 마스코트 — 인트로 마스코트가 도착한 뒤에만 나타난다.
   처음부터 보이면 날아오는 마스코트와 겹쳐 '잔상'처럼 보인다. */
.mascot-head{width:32px;height:32px;flex:none;display:inline-flex;margin-right:2px;
 opacity:0;transition:opacity .22s ease}
.mascot-head.show{opacity:1}
.mascot-head svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:reduce){
 #intro .intro-mascot,#intro .intro-text,#intro .intro-sub,#intro .intro-btn{animation:none}
}
</style>
</head>
<body>
<footer>
 <b>🔔 알림 받기</b> — 관심 있는 일에 ☆를 누른 뒤 위 [🔔 알림받기]를 누르면
 휴대폰 캘린더에 담깁니다. 그러면 날짜 전에 휴대폰이 알아서 알려 줍니다.<br><br>
 이 정보는 봉화군 홈페이지에 공개된 주간업무 계획을 바탕으로 합니다.
 계획 단계의 내용이므로 실제 일정과 장소가 달라질 수 있습니다.
 참여하시기 전에 담당 부서로 한 번 확인해 주세요.<br><br>
 <a href="https://www.bonghwa.go.kr/main.do" target="_blank" rel="noopener">🔗 봉화군청 홈페이지 바로가기</a>
</footer>
<script src="core.js"></script>
<script src="ui.js"></script>
<script>
(function(){const s=document.createElement('script');s.src='data.js?v='+Date.now();s.onload=init;document.head.appendChild(s)})();

function init(){
 const D=window.BW_DATA, E=BW.escH;
 const FKEY='bh.fav';
 let fav={};try{fav=JSON.parse(localStorage.getItem(FKEY))||{}}catch(e){}
 const saveFav=()=>localStorage.setItem(FKEY,JSON.stringify(fav));
 const phoneOf=d=>D.deptPhones[d]||'';

 /* 분류는 현안마다 한 번만 계산해 둔다 (3천 건을 매번 훑으면 느리다) */
 const tag=iss=>{
  if(iss._cls)return iss._cls;
  const last=iss.list[iss.list.length-1];
  iss._cls={
   topics:BW.topicsOf(last.item),
   auds:BW.audiencesOf(last.item),
   regions:BW.regionsOf(last.item),
   score:BW.citizenScore(last.item),
   week:last.week, item:last.item
  };
  return iss._cls;
 };

 /* ── 관심 업무 → 휴대폰 캘린더 알림 ──
    서버가 없어 앱이 직접 알림을 못 보내므로, 일정을 알림과 함께 캘린더에 넣어
    휴대폰 캘린더가 대신 알려주게 한다(.ics 파일). 개인정보·계정 없이 동작. */
 const pad=n=>String(n).padStart(2,'0');
 /* 안건별 고정 UID — 제목이 전부 한글이어도 겹치지 않게 해시로 만든다.
    같은 안건은 늘 같은 UID라, 다시 담아도 캘린더에 중복 생성되지 않는다. */
 const uidHash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
 const icsD=ymd=>ymd.replace(/-/g,'');
 const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/[;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const icsStamp=()=>{const d=new Date();return ''+d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'};
 function timeOf(item){
  for(const l of item.lines){const m=l.txt.match(/(\d{1,2})\s*:\s*(\d{2})/);if(/일\s*시/.test(l.txt)&&m)return{h:+m[1],mi:+m[2]}}
  return null;
 }
 function icsEvent(iss){
  const c=tag(iss), r=BW.parseDateRange(c.item,c.week);
  if(!r||!r.start)return null;
  const today=BW.ymd(new Date()), end=r.end||r.start;
  if(end<today)return null;                          /* 이미 지난 일정은 알림 무의미 */
  const placeLine=c.item.lines.find(l=>/^(장\s*소|위\s*치)/.test(l.txt));
  const loc=placeLine?placeLine.txt.replace(/^[^:：]*[:：]\s*/,'').trim():c.regions.filter(x=>x!=='공통').join(', ');
  const t=timeOf(c.item);
  const L=['BEGIN:VEVENT','UID:bh'+uidHash(iss._id)+'@bonghwa','DTSTAMP:'+icsStamp()];
  let alarms;
  if(t){
   L.push('DTSTART:'+icsD(r.start)+'T'+pad(t.h)+pad(t.mi)+'00');
   const ed=new Date(BW.d2(r.start).getFullYear(),BW.d2(r.start).getMonth(),BW.d2(r.start).getDate(),t.h+1,t.mi);
   L.push('DTEND:'+icsD(BW.ymd(ed))+'T'+pad(ed.getHours())+pad(ed.getMinutes())+'00');
   alarms=['-P1D','-PT2H'];                          /* 하루 전 · 2시간 전 */
  }else{
   L.push('DTSTART;VALUE=DATE:'+icsD(r.start),'DTEND;VALUE=DATE:'+icsD(BW.ymd(BW.addD(BW.d2(end),1))));
   alarms=['-PT15H'];                                /* 종일 → 전날 오전 9시쯤 */
  }
  L.push('SUMMARY:'+icsEsc('[봉화군] '+iss.title));
  if(loc)L.push('LOCATION:'+icsEsc(loc));
  L.push('DESCRIPTION:'+icsEsc(iss.dept+' · 봉화군 주간업무 안내\n계획 단계 정보라 실제 일정과 다를 수 있습니다.'));
  alarms.forEach(tr=>L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(iss.title),'TRIGGER:'+tr,'END:VALARM'));
  L.push('END:VEVENT');
  return L.join('\r\n');
 }
 function buildICS(list){
  const evs=list.map(icsEvent).filter(Boolean);
  if(!evs.length)return null;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bonghwa//weekly//KO','CALSCALE:GREGORIAN',...evs,'END:VCALENDAR'].join('\r\n');
 }
 function downloadICS(text,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
 }
 /* 파일을 '어디 저장됐는지 모르게' 내려받는 대신, 팝업을 띄우고
    한 번 눌러 바로 캘린더에 추가되게 한다. 카카오톡 인앱 브라우저는
    다운로드가 잘 안 보이므로 '기본 브라우저로 열기'를 함께 안내한다. */
 const UA=navigator.userAgent;
 const inApp=/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(UA);
 const isKakao=/KAKAOTALK/i.test(UA);

 function calModal(list,base){
  const events=list.map(icsEvent).filter(Boolean);
  if(!events.length){BWUI.toast('알림 받을 일정이 없어요 — 날짜가 지났거나 정해지지 않았습니다');return}
  const ics=buildICS(list), fname=base+'.ics';
  let m=document.getElementById('calModal');
  if(!m){m=document.createElement('div');m.id='calModal';m.className='modal';document.body.appendChild(m)}
  m.innerHTML=`<div class="mbox">
    <h2>휴대폰 캘린더에 추가</h2>
    <div class="note">관심 일정 <b>${events.length}개</b>를 캘린더에 담아요.
      추가하면 <b>날짜 전에 휴대폰이 알림</b>을 줍니다. (기존 일정은 그대로예요)</div>
    <div style="padding:8px 18px 2px"><button class="callbtn" id="calAdd" style="width:100%">📅 캘린더에 추가하기</button></div>
    ${inApp?`<div class="note" style="color:var(--warn);padding-top:8px">
       ${isKakao?'카카오톡 화면에서는 캘린더 추가가 막힐 수 있어요. 아래 <b>[기본 브라우저로 열기]</b>를 누른 뒤 다시 시도해 주세요.'
                :'앱 안에서는 막힐 수 있어요. 오른쪽 위 메뉴 → <b>‘다른 브라우저로 열기’</b> 후 다시 시도해 주세요.'}</div>
       ${isKakao?`<div style="padding:4px 18px 0"><button class="callbtn" id="calExt" style="width:100%;background:var(--paper);color:var(--acc);border:1.5px solid var(--acc)">🌐 기본 브라우저로 열기</button></div>`:''}`:''}
    <div class="mfoot"><span style="flex:1"></span><button id="calCancel">닫기</button></div>
  </div>`;
  m.classList.add('open');
  const close=()=>m.classList.remove('open');
  m.querySelector('#calCancel').onclick=close;
  m.onclick=e=>{if(e.target===m)close()};
  const ext=m.querySelector('#calExt');
  /* 기본 브라우저로 열면 완전히 새 페이지로 뜬다 — 방금 보던 화면(이 안건)을
     주소에 담아 보내서, 열리자마자 같은 자리(상세+알림 팝업)로 되돌아오게 한다.
     즐겨찾기는 카카오톡 안 저장소에만 있어 새 브라우저로 안 넘어오므로,
     안건 번호 자체를 실어 보낸다. */
  if(ext)ext.onclick=()=>{
   const url=new URL(location.pathname,location.origin);
   url.searchParams.set('r',list.map(i=>uidHash(i._id)).join(','));   /* 짧은 코드로 — 링크 길이 절약 */
   location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url.href);
  };
  m.querySelector('#calAdd').onclick=async()=>{
   const file=new File([ics],fname,{type:'text/calendar'});
   /* 1) 공유 시트 — 가장 매끄럽다. 눌러서 '캘린더'를 고르면 바로 추가된다. */
   if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'봉화군 관심 일정'});close();return}
    catch(err){if(err&&err.name==='AbortError')return}   /* 사용자가 취소 */
   }
   /* 2) 공유가 안 되면 파일 열기 — 열리면 캘린더 추가 화면이 뜬다. */
   downloadICS(ics,fname); close();
   BWUI.toast('파일이 열리면 [추가]를 누르면 캘린더에 들어갑니다');
  };
 }
 function remindFav(){
  const favIss=BWUI.api.issues.filter(i=>fav[i._id]);
  if(!favIss.length){BWUI.toast('관심 업무를 먼저 담아 주세요 (☆)');return}
  calModal(favIss,'봉화군_관심일정');
 }

 /* ── 이 소식을 친구에게 공유 ──
    안건 번호를 주소에 실어, 링크를 받은 사람이 열면 바로 그 안건이 뜬다.
    휴대폰은 공유 시트(카톡·문자 등)를, 안 되면 링크 복사로 넘어간다. */
 function shareUrlOf(iss){
  const path=location.pathname.replace(/index\.html$/,'');   /* .../ 형태로 — index.html 안 붙게 */
  const url=new URL(path||'/',location.origin);
  url.searchParams.set('i',uidHash(iss._id));   /* 한글 안건번호 대신 짧은 코드 — 링크가 길어지지 않게 */
  return url.href;
 }
 function copyLink(u){
  if(navigator.clipboard&&navigator.clipboard.writeText){
   navigator.clipboard.writeText(u).then(
    ()=>BWUI.toast('링크를 복사했어요 — 붙여넣기로 전달하세요'),

 function shareIssue(iss){
  const url=shareUrlOf(iss);
  const r=BW.parseDateRange(tag(iss).item,tag(iss).week);
  let when='';
  if(r&&r.start){const s=BW.d2(r.start);when=`${s.getMonth()+1}월 ${s.getDate()}일 · `}
  const text=`[봉화군 이번 주 소식] ${iss.title}\n${when}자세히 보기 👇`;
  const data={title:'봉화의 오늘',text,url};
  /* 휴대폰은 OS 공유 시트(카카오톡·문자·메일 등)를 띄운다.
     canShare로 가능 여부를 먼저 확인하고, 안 되는 기기(구형·일부 PC)만 링크 복사로 넘어간다. */
  if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
   navigator.share(data).catch(err=>{
    if(err&&err.name==='AbortError')return;   /* 사용자가 시트를 닫음 — 조용히 */
    copyLink(url);                            /* 공유가 실패한 기기만 복사로 대체 */
   });
   return;
  }
  copyLink(url);
 }

 /* ── 첫 화면 인트로: 인사 → [시작하기] → 마스코트가 헤더로 날아가고 본문이 드러남 ── */
 function setupIntro(){
  const head=document.querySelector('.bw-head .in')||document.querySelector('.bw-head');
  if(!head)return;
  /* 헤더 왼쪽에 마스코트를 미리 심어 둔다(도착 지점) */
  const hm=document.createElement('span'); hm.className='mascot-head'; hm.innerHTML=MASCOT;
  head.insertBefore(hm,head.firstChild);

  const intro=document.createElement('div'); intro.id='intro';
  intro.innerHTML=`<div class="ibg"></div>
    <div class="intro-mascot">${MASCOT}</div>
    <div class="intro-text">안녕하세요<br><b>봉화의 오늘</b>이<br>이번 주 소식을 알려드립니다</div>
    <div class="intro-sub">봉화군 주간 소식 · ${D.weekStart} 기준</div>
    <button class="intro-btn" id="introGo">시작하기</button>`;
  document.body.appendChild(intro);
  document.documentElement.style.overflow='hidden';   /* 인트로 동안 스크롤 잠금 */

  const finish=()=>{ intro.remove(); document.documentElement.style.overflow=''; };
  document.getElementById('introGo').onclick=()=>{
   const im=intro.querySelector('.intro-mascot');
   const src=im.getBoundingClientRect(), dst=hm.getBoundingClientRect();
   const sc=dst.width/src.width;
   const tx=(dst.left+dst.width/2)-(src.left+src.width/2);
   const ty=(dst.top+dst.height/2)-(src.top+src.height/2);
   im.style.animation='none';                          /* floaty 정지 후 비행 */
   im.querySelector('svg').style.filter='none';         /* 그림자 필터는 축소 중 흐려 보여 끈다 */
   /* floaty가 멈춘 그 자리 그대로 트랜지션 없이 고정해 둔다.
      (transition과 transform을 같은 프레임에서 같이 걸면 브라우저가
       전환을 건너뛰고 바로 순간이동해 버려 잔상처럼 보인다) */
   const frozen=getComputedStyle(im).transform;
   im.style.transition='none';
   im.style.transform=(frozen==='none')?'':frozen;
   void im.offsetWidth;                                 /* 강제 리플로우로 위 상태를 확정 */
   requestAnimationFrame(()=>{
    /* 튕기지 않고 감속만 하는 이징 — 도착지에 이미 있는 헤더 마스코트와
       겹쳐 튕기면 잔상처럼 보이므로 overshoot 없는 곡선을 쓴다 */
    im.style.transition='transform .5s cubic-bezier(.3,.7,.2,1)';
    im.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
    intro.classList.add('go');                         /* 글·버튼·배경 사라짐 */
   });
   let done=false;
   const end=()=>{
    if(done)return; done=true;
    hm.classList.add('show');                          /* 도착한 뒤에야 헤더 마스코트를 보여준다 */
    setTimeout(finish,120);                             /* 겹치는 순간 없이 자연스럽게 이어받는다 */
   };
   im.addEventListener('transitionend',end,{once:true});
   setTimeout(end,650);                                /* transitionend 누락 대비 */
  };
 }

    이번 주 7일을 요일·날짜로 늘어놓고, 날짜를 누르면 그날 '진행 중'(진행기간 포함)인

 const WEEK_MONTH=D.weekStart.slice(0,7);
 const WSTART=BW.d2(D.weekStart);
 const WEEKDAYS=[]; for(let i=0;i<7;i++){ const d=new Date(WSTART); d.setDate(WSTART.getDate()+i); WEEKDAYS.push(BW.ymd(d)); }
 function setScope(sc){
  const S=BWUI.api.state;
  if(sc==='month'){ S.scope='month'; S.month=WEEK_MONTH; S.day=''; }
  else if(sc==='all'){ S.scope='all'; S.day=''; }
  else { S.scope='week'; S.month=WEEK_MONTH; S.day=''; }
  S.limit=60; BWUI.api.render();
 }
 function setDay(day){ const S=BWUI.api.state; S.scope='day'; S.day=day; S.month=day.slice(0,7); S.limit=60; BWUI.api.render(); }

 function buildDayStrip(){

  const today=BWUI.api.today, td=BW.d2(today);
  const cntOf=day=>BWUI.api.issues.filter(i=>i.list.some(o=>BW.coversDate(o.item,o.week,day))).length;
  const box=document.createElement('div'); box.id='wstrip'; box.className='wstrip';
  box.innerHTML=`

      ${WEEKDAYS.map(day=>{const d=BW.d2(day);const we=d.getDay()===0||d.getDay()===6;const n=cntOf(day);
        return `<button type="button" class="calday ${we?'we':''} ${n?'':'zero'}" data-day="${day}">
          <span class="dow">${BW.DOW[d.getDay()]}</span><span class="d">${d.getDate()}</span><span class="cnt">${n}</span>
          ${day===today?'<span class="ws-dot"></span>':''}</button>`;}).join('')}
    </div>`;
  wrap.insertBefore(box,wrap.firstChild);
  box.querySelectorAll('#wsScopes button').forEach(b=>b.onclick=()=>setScope(b.dataset.sc));
  box.querySelectorAll('.calday').forEach(b=>b.onclick=()=>setDay(b.dataset.day));
 }

    </button>
    <div class="ps-panel" id="psPanel">
      <input type="search" class="ps-input" id="psInput" enterkeyhint="search" placeholder="궁금한 일을 검색해 보세요 (축제, 도로, 교육)">
      <div class="ps-actions">
        <button type="button" class="ps-reset" id="psReset">지우기</button>
        <button type="button" class="ps-go" id="psGo">검색</button>
      </div>
    </div>`;
  wrap.insertBefore(card,wrap.firstChild);
  const S=BWUI.api.state, input=card.querySelector('#psInput');
  const setOpen=o=>{ card.classList.toggle('open',o); if(o){ input.value=S.q||''; setTimeout(()=>input.focus(),80); } };
  card.querySelector('#psBar').onclick=()=>setOpen(!card.classList.contains('open'));
  let t; input.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ S.q=input.value.trim(); S.limit=60; BWUI.api.render(); },180); };
  input.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); clearTimeout(t); S.q=input.value.trim(); BWUI.api.render(); setOpen(false); } };
  card.querySelector('#psGo').onclick=()=>{ clearTimeout(t); S.q=input.value.trim(); BWUI.api.render(); setOpen(false); };
  card.querySelector('#psReset').onclick=()=>{ input.value=''; S.q=''; S.limit=60; BWUI.api.render(); };
  syncSearchCard();
 }

 /* 필터가 바뀔 때마다 상단(달력·검색·목록 제목)을 실제 상태에 맞춘다 */
 function syncTopControls(){
  const S=BWUI.api.state, strip=document.getElementById('wstrip');
  if(strip){
   strip.querySelectorAll('#wsScopes button').forEach(b=>b.classList.toggle('on',b.dataset.sc===S.scope));
   strip.querySelectorAll('.calday').forEach(b=>b.classList.toggle('on',S.scope==='day'&&b.dataset.day===S.day));
  }
  syncSearchCard();
  const listh=document.querySelector('#bwInfo .listh');
  if(listh){
   let t;
   if(S.scope==='day') t=(S.day===BWUI.api.today?'오늘':(()=>{const d=BW.d2(S.day);return `${d.getMonth()+1}월 ${d.getDate()}일(${BW.DOW[d.getDay()]})`;})())+' 봉화의 소식은?';
   else if(S.scope==='month'){const[y,m]=S.month.split('-');t=`${+y}년 ${+m}월 봉화의 소식은?`;}
   else if(S.scope==='all') t='전체 봉화의 소식은?';
   else t='이번 주 봉화의 소식은?';
   listh.textContent=t;
  }
 }

 decorateHeader();
 buildSearchCard();
 buildDayStrip();               /* 마지막에 넣어 맨 위에 오게 한다 */
 /* 기본: 오늘이 이번 자료 주간이면 '오늘 소식'부터, 아니면 이번 주 전체 */
 if(WEEKDAYS.includes(BWUI.api.today)) setDay(BWUI.api.today); else setScope('week');

 /* 링크로 들어온 경우 처리 — 인트로를 건너뛰고 해당 안건으로 바로 간다.
    코드는 짧은 해시(i·r)를 쓰되, 예전 긴 링크(item·remind, 전체 안건번호)도 계속 열리게 둔다. */
 const params=new URLSearchParams(location.search);
 const resumeCode=params.get('r')||params.get('remind');   /* 카카오톡 → 기본 브라우저 전환(알림 팝업까지) */
 const openCode=params.get('i')||params.get('item');        /* 친구가 보낸 공유 링크(상세만 열기) */
 /* 짧은 해시 또는 예전 전체 ID 둘 다로 안건을 찾는다 */
 const matchCodes=csv=>{const cs=csv.split(',');return BWUI.api.issues.filter(i=>cs.includes(uidHash(i._id))||cs.includes(i._id))};
 if(resumeCode){
  history.replaceState(null,'',location.pathname);      /* 주소창은 깨끗하게 되돌려 둔다 */
  const targets=matchCodes(resumeCode);
  targets.forEach(i=>{ if(!fav[i._id])fav[i._id]={at:BW.ymd(new Date())} });  /* 이 브라우저에도 관심 표시를 맞춘다 */
  if(targets.length)saveFav();
  if(targets.length===1){
   BWUI.api.openSheet(targets[0]);
   calModal(targets,'봉화군_'+targets[0].title.replace(/[^가-힣0-9a-zA-Z]/g,'').slice(0,14));
  }else if(targets.length){
   calModal(targets,'봉화군_관심일정');
  }
 }else if(openCode){
  history.replaceState(null,'',location.pathname);
  const target=matchCodes(openCode)[0];
  if(target){ BWUI.api.openSheet(target); }        /* 공유받은 소식 바로 펼치기(알림·관심 강제 안 함) */
  else{ BWUI.toast('공유된 소식을 찾지 못했어요 — 지난주 자료이거나 정보가 바뀌었을 수 있어요'); }
 }else{
  setupIntro();   /* 처음 들어왔을 때만 인트로를 보여준다 */
 }
}
</script>
</body>
</html>
