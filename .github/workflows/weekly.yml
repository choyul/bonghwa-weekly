name: 주간업무 자동 갱신

# 매주 목요일에 봉화군 홈페이지를 확인해 새 주간업무가 올라왔으면 data.js를 갱신한다.
# 새 주차가 없으면 아무것도 커밋하지 않는다(무해).
on:
  schedule:
    - cron: '0 1 * * 4'    # UTC 목 01:00 = 한국시간 목요일 오전 10시
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 새 주간업무 내려받기·변환 (봉화군 홈페이지 → md)
        run: python3 build/fetch_latest.py .hwp_tmp md

      - name: data.js 재생성 (md → data.js)
        run: node build/build.js md data.js

      - name: 바뀌었으면 커밋·푸시
        run: |
          if [[ -n "$(git status --porcelain data.js md)" ]]; then
            git config user.name "bonghwa-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js md
            git commit -m "주간 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
            echo "갱신 완료"
          else
            echo "새 주차 없음 — 변경 없음"
          fi

