name: 오늘의 봉화 자동 갱신

# 매일 봉화군 홈페이지를 확인한다.
#  - 주간업무: 새 주차가 올라왔으면 data.js 갱신(대개 목요일에만 바뀜, 없으면 무커밋)
#  - 고시·공고: 최근 3개월치를 매일 새로 받아 notices.js 갱신
#  - 주간행사: 새 주차의 주간행사표를 받아 events.js 갱신(이미 받은 주는 건너뜀)
#  - 봉화뉴스는 여기서 하지 않는다 → 별도 워크플로 news.yml 이 2시간마다 맡는다
on:
  schedule:
    - cron: '0 1 * * *'    # UTC 01:00 = 한국시간 매일 오전 10시
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 새 주간업무 내려받기·변환 (봉화군 홈페이지 → md)
        run: python3 build/fetch_latest.py .hwp_tmp md

      - name: data.js 재생성 (md → data.js)
        run: node build/build.js md data.js

      - name: 고시·공고 최근 3개월 수집 (봉화군 게시판 → notices.js)
        run: python3 build/fetch_gosi.py notices.js 3
        continue-on-error: true   # 게시판 일시 오류가 주간 갱신을 막지 않도록

      - name: 주간행사 최근 2개월 수집 (주간행사계획 첨부 → events.js)
        run: python3 build/fetch_events.py events.js 2
        continue-on-error: true   # 첨부 형식이 바뀌어도 주간 갱신을 막지 않도록

      - name: 아이콘 날짜 갱신 (달력 숫자 = 오늘)
        # 홈 화면에 실제로 박히는 것은 manifest 가 가리키는 PNG 세 장이다.
        # SVG 만 고쳐 두면 새로 설치하는 사람도 옛 날짜를 보게 되므로 PNG 까지 다시 그린다.
        # 아이콘의 글자는 전부 도형이라 서버에 한글 글꼴이 없어도 똑같이 나온다.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          python3 build/make_icon.py icon.svg
          python3 build/make_icon.py icon-maskable.svg --maskable
          bash build/make_icon_png.sh
        continue-on-error: true

      - name: 바뀌었으면 커밋·푸시
        run: |
          if [[ -n "$(git status --porcelain data.js md notices.js events.js icon.svg icon-maskable.svg icon-m192.png icon-m512.png icon-mmask512.png)" ]]; then
            git config user.name "bonghwa-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.js md notices.js events.js icon.svg icon-maskable.svg icon-m192.png icon-m512.png icon-mmask512.png
            git commit -m "자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
            echo "갱신 완료"
          else
            echo "변경 없음"
          fi
